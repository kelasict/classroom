<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassRoom Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#1a73e8' } } } };</script>
  <script>
  /* Penjaga error: tampil di layar walau Script utama gagal dimuat */
  window.showFatal=function(m){var b=document.getElementById('fatal');if(!b){b=document.createElement('div');b.id='fatal';b.setAttribute('role','alert');b.style.cssText='position:fixed;left:1rem;right:1rem;top:1rem;z-index:200;background:#fde7e3;color:#8a2a1c;border-radius:1rem;padding:.9rem 1.2rem;font:600 .85rem system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer';b.onclick=function(){b.remove()};(document.body||document.documentElement).appendChild(b);}b.textContent='Terjadi kesalahan: '+m+' (klik untuk menutup, kirim tangkapan layar ini ke pengembang)';};
  window.addEventListener('error',function(e){showFatal((e.message||'Kesalahan')+(e.lineno?' [baris '+e.lineno+']':''));});
  window.addEventListener('unhandledrejection',function(e){showFatal((e.reason&&e.reason.message)||String(e.reason));});
  window.addEventListener('DOMContentLoaded',function(){if(typeof CONFIG!=='undefined'&&!/^https:[/][/]script[.]google/.test(CONFIG.API_URL||'')){var w=document.createElement('div');w.style.cssText='background:#fcebc4;color:#6f5010;font:600 .85rem system-ui,sans-serif;padding:.7rem 1rem;text-align:center';w.textContent='Pengaturan belum lengkap: buka file config.js lalu isi API_URL dengan URL Web App Apps Script.';document.body.insertBefore(w,document.body.firstChild);}});
  setTimeout(function(){if(!window.__crlReady)showFatal('File app.js tidak termuat lengkap. Pastikan index.html, style.css, config.js, dan app.js semuanya ada di repository GitHub, lalu tekan Ctrl+Shift+R.');},4000);
  </script>
  <link rel="stylesheet" href="style.css" onerror="showFatal('File style.css tidak ditemukan di GitHub. Unggah style.css ke repository (satu tempat dengan index.html).')">
</head>
<body class="login-bg">
  <!-- Layar login / daftar -->
  <div id="screen-login" class="min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="logo-tile mb-3">
        <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>
      </div>
      <h1 class="text-3xl font-extrabold" style="letter-spacing:-.02em">ClassRoom Lite</h1>
      <p class="text-sm text-gray-500 font-semibold">Ruang belajar yang tenang untuk guru dan siswa</p>
    </div>

    <div class="card login-card">
      <div class="p-4 pb-0"><div class="tabbar" style="width:100%">
        <button type="button" id="tab-login" class="tab active flex-1 justify-center">Masuk</button>
        <button type="button" id="tab-register" class="tab flex-1 justify-center">Daftar Siswa</button>
      </div></div>

      <div class="p-5">
        <div id="alert-box" class="hidden" role="alert"></div>

        <!-- LOGIN -->
        <form id="login-form" class="space-y-4">
          <div>
            <label class="label" for="login-email">Email</label>
            <input class="input" id="login-email" name="email" type="email" required autocomplete="username" placeholder="nama@email.com">
          </div>
          <div>
            <label class="label" for="login-password">Password</label>
            <input class="input" id="login-password" name="password" type="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-full py-2.5">Masuk</button>
          <p class="text-xs text-gray-500 text-center">Peran (guru / siswa) dikenali otomatis dari akun Anda.</p>
        </form>

        <!-- REGISTER SISWA -->
        <form id="register-form" class="space-y-4 hidden">
          <div>
            <label class="label" for="reg-nama">Nama lengkap</label>
            <input class="input" id="reg-nama" name="nama" required maxlength="80" autocomplete="name">
          </div>
          <div>
            <label class="label" for="reg-email">Email</label>
            <input class="input" id="reg-email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label" for="reg-pass">Password</label>
              <input class="input" id="reg-pass" name="password" type="password" required minlength="6" autocomplete="new-password">
            </div>
            <div>
              <label class="label" for="reg-pass2">Ulangi password</label>
              <input class="input" id="reg-pass2" name="password2" type="password" required minlength="6" autocomplete="new-password">
            </div>
          </div>
          <div>
            <label class="label" for="reg-kode">Kode kelas</label>
            <input class="input uppercase tracking-widest" id="reg-kode" name="kode_kelas" required maxlength="6" minlength="6" placeholder="mis. MTK7A1">
            <p class="hint">Minta kode 6 karakter ini dari gurumu.</p>
          </div>
          <button type="submit" class="btn btn-primary w-full py-2.5">Daftar &amp; Masuk</button>
        </form>
      </div>
    </div>
    <p class="text-center text-xs text-gray-500 mt-4 font-semibold">Akun guru dibuat oleh admin di Spreadsheet.</p>
  </main>
  </div>

  <!-- Dashboard guru / siswa dirender ke sini oleh JavaScript -->
  <div id="app" class="hidden"></div>
  <div id="toast-root"></div>

  <script src="config.js" onerror="showFatal('File config.js tidak ditemukan di GitHub. Unggah config.js ke repository (satu tempat dengan index.html).')"></script>
  <script src="app.js" onerror="showFatal('File app.js tidak ditemukan di GitHub. Unggah app.js ke repository (satu tempat dengan index.html).')"></script>
</body>
</html>
